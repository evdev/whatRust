# Custom commands need their own ACL entries; notification:default only grants
# plugin:notification commands. Defining this manifest also opts LOCAL windows
# into ACL checks, so preserve their separate settings and unlock permissions.
[[permission]]
identifier = "allow-whatsapp-bridge"
description = "Forward notifications, unread titles and diagnostics from WhatsApp account windows."
commands.allow = [
  "notify", "notification_icon", "set_unread", "dlog", "switcher_accounts", "switch_account", "zoom_step",
  "voice_prefs", "voice_lookup", "transcribe_voice", "summarize_voice",
  "todo_list", "todo_add", "todo_update", "todo_toggle_done", "todo_delete",
  "todo_snooze", "todo_dismiss_alarm", "todo_clear_done",
  "autoreply_state", "autoreply_set_chat", "autoreply_get_chat_doc",
  "autoreply_save_chat_doc", "autoreply_reset_chat_doc", "autoreply_open_chat_doc",
  "autoreply_turn", "autoreply_record_sent", "autoreply_pause_self"
]

[[permission]]
identifier = "allow-settings-commands"
description = "Manage settings and accounts from the bundled settings window."
commands.allow = [
  "get_settings", "set_settings", "open_settings", "pick_download_dir", "choose_app_icon",
  "reset_app_icon", "list_accounts",
  "add_account", "remove_account", "rename_account", "open_account", "set_default_account",
  "get_lock_status", "set_app_lock_password", "change_app_lock_password",
  "disable_app_lock", "set_app_lock_options", "set_biometric_enabled", "lock_app",
  "fluidvoice_status", "set_ai_key", "list_ai_models",
  "autoreply_get_persona", "autoreply_save_persona", "autoreply_reset_persona",
  "autoreply_open_persona", "list_standin_cli_models", "standin_cli_status",
  "get_update_status", "check_for_updates", "install_update", "restart_to_update", "open_release_page"
]

[[permission]]
identifier = "allow-lock-commands"
description = "Read lock status and unlock or reset from the bundled lock screen."
commands.allow = ["get_lock_status", "unlock_password", "unlock_biometric", "reset_app_lock"]
