<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>whatRust</title>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="mention-popup.css" />
  </head>
  <body>
    <article class="card">
      <header>
        <button id="open" type="button">
          <span id="avatar" aria-hidden="true"></span>
          <span class="who">
            <strong id="sender"></strong>
            <span id="meta"></span>
          </span>
        </button>
        <button id="close" type="button" aria-label="Close"></button>
      </header>
      <button id="body" type="button"></button>
      <form id="reply">
        <div id="attachment" hidden>
          <span id="attachment-name"></span>
          <button id="attachment-clear" type="button" aria-label="Remove the file"></button>
        </div>
        <audio id="voice-preview" hidden controls></audio>
        <div id="voice-status" hidden>
          <span id="voice-dot" aria-hidden="true"></span>
          <span id="voice-time"></span>
          <span id="voice-wave" aria-hidden="true"></span>
        </div>
        <textarea id="text" rows="2" maxlength="4096" placeholder="Write a reply"></textarea>
        <div class="actions">
          <button id="attach" type="button" aria-label="Attach a file"></button>
          <button id="voice" type="button" aria-label="Record a voice note">
            <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M11.999 14.942c2.001 0 3.531-1.53 3.531-3.531V4.35c0-2.001-1.53-3.531-3.531-3.531S8.469 2.35 8.469 4.35v7.061c0 2.001 1.53 3.531 3.53 3.531zm6.238-3.53c0 3.531-2.942 6.238-6.237 6.238-3.296 0-6.238-2.707-6.238-6.238H3.761c0 4.003 3.061 7.296 6.945 7.767v3.531h2.588v-3.531c3.884-.471 6.945-3.764 6.945-7.767h-2.002z"/>
            </svg>
            <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
            </svg>
          </button>
          <span id="error" role="status"></span>
          <button id="send" type="submit">Send</button>
        </div>
      </form>
      <input id="file" type="file" hidden />
    </article>
    <script src="mention-popup.js"></script>
  </body>
</html>
