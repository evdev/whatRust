name: Build macOS installer

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-macos-installer.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: --target aarch64-apple-darwin --bundles dmg -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whatRust-macos-apple-silicon
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*_aarch64.dmg
          if-no-files-found: error
